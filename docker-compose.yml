services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7300:80"
    volumes:
      - ./:/var/www/html/
      - ./required_files/default.conf:/etc/apache2/sites-enabled/000-default.conf

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: plzletme!n123
      MYSQL_DATABASE: erp_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./required_files/erp_db.sql:/docker-entrypoint-initdb.d/erp_db.sql

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "7320:80"
    environment:
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 1024M

volumes:
  mysql-data: